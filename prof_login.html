{% extends "base.html" %}

{% block title %}Connexion Professeur{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-icon">👨‍🏫</div>
        <h2>Espace Professeur</h2>
        <p>Accès réservé aux professeurs</p>

        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" 
                       placeholder="Entrez le mot de passe" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-large">
                🔓 Se connecter
            </button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('index') }}">← Retour à l'accueil</a>
        </div>
    </div>
</div>
{% endblock %}
